# Local copy of the Toolshop app (sprint 5), run from the prebuilt images published by
# https://github.com/testsmith-io/practice-software-testing, so the tests can run without
# the public site (which sits behind a Cloudflare bot check for CI runners).
#
# Use docker/start-app.sh to start it: it first downloads the nginx config mounted into `web`.
# Images are pinned by digest (the tag is only a label); to update, pull the new tag and
# replace the digest with `docker image inspect <image> --format '{{index .RepoDigests 0}}'`.
#
# UI:  http://localhost:4200    API: http://localhost:8091
name: toolshop

services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5@sha256:881cb7ecd76477994728648c0c16f6e9d2beed0f0217734843a32a7bb92553f0
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5@sha256:f907d8daae32dc90ba900e964928d00bf0aabfab7067eaeeaa49f5a0f70c52e6
    ports:
      - 4200:4200
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

  # The published `web` image is ARM-only, so use stock nginx (multi-arch) with the project's vhost config
  web:
    image: nginx:1.23.3-alpine@sha256:6318314189b40e73145a48060bff4783a116c34cc7241532d0d94198fb2c9629
    ports:
      - 8091:80
    volumes:
      # Shared with laravel-api (read-only) so nginx can serve the static files under public/
      - type: volume
        source: laravel-app-code
        target: /var/www
        read_only: true
      # Fail with a clear error instead of creating an empty directory when start-app.sh has not downloaded it yet
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11@sha256:8bb25ca2d68c81118fcf745959560de2f316a178abf9decc8bb5b6f86c929084
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  laravel-app-code:
