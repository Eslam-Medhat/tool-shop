name: Playwright Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's outdated run. Pushes to master/main get a group of
# their own (per commit), so they are never cancelled or replaced: every merged commit is tested.
# Runs do not share data (each has its own app and database), so they can safely run in parallel.
concurrency:
  group: playwright-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The tests run against a local copy of the app (docker/docker-compose.yml) with a freshly
    # seeded database, so no secrets are needed: these are the public demo accounts from
    # https://testsmith-io.github.io/practice-software-testing/
    env:
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
      USER_EMAIL: customer@practicesoftwaretesting.com
      USER_PASSWORD: welcome01
    steps:
      - uses: actions/checkout@v5

      # Starts the containers, seeds the database and waits until the API and the UI answer
      - name: Start the Toolshop app
        timeout-minutes: 12
        run: ./docker/start-app.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        timeout-minutes: 10
        run: npx playwright test --reporter=github,html

      # Only safe because the tests log in with the public demo account. Reports and traces can contain
      # typed values (passwords) and artifacts of a public repo are downloadable by any GitHub user:
      # if real credentials are ever used here, stop uploading this
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Show app logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail=100
